<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>meterless</title>
<style>
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:600;font-display:swap;src:url(/assets/fonts/bricolage-grotesque-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:700;font-display:swap;src:url(/assets/fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:800;font-display:swap;src:url(/assets/fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(/assets/fonts/inter-latin-var.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
  :root{
    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-display: 'Bricolage Grotesque', var(--font-sans);
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  }
  :root{
    --ink:#152238; --teal:#0F8C7E; --teal-bright:#5FD3C4;
    --ink-soft:#3D4A61; --muted:#8A94A6; --line:#DDE3EA;
    --wash:#F7F8FA; --tint:#E3F2EF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font-sans); color:var(--ink);
    background:radial-gradient(ellipse 62% 46% at 50% 38%, rgba(15,140,126,.05), rgba(15,140,126,0) 70%),
               linear-gradient(180deg,#FFFFFF 0%,var(--wash) 62%,var(--tint) 100%);
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:28px 24px;
  }
  .logo{font-family:var(--font-display);font-weight:700;font-size:1.5rem;
        letter-spacing:-.02em;color:var(--ink);text-decoration:none;align-self:center;
        margin-top:6px}
  .logo .dot{color:var(--teal)}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
       text-align:center;max-width:480px;width:100%;padding-bottom:4vh}
  footer{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;
         text-transform:uppercase;color:#AAB4C4;padding-top:26px}

  h1{font-family:var(--font-display);font-weight:700;
      font-size:clamp(1.5rem,4.4vw,2.2rem);letter-spacing:-.02em;line-height:1.35}
</style>
</head>
<body>
  <a class="logo" href="/">meterless<span class="dot">.</span></a>
  <main>
    <h1>You are on the waitlist. The founding cohort is by invitation.</h1>
  </main>
  <footer>© 2026 Meterless Limited. meterless is a trade mark of Meterless Limited.</footer>
</body>
</html>
